name: 刷课

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 添加这行后，可以在Actions页面手动点击运行

jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 建议用3.11，3.13太新了，有些第三方库可能没适配

      - name: 安装依赖包
        run: |
          pip install -r ./requirements.txt

      - name: Run main.py
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
        # 注意这里：使用 secrets 变量代替明文密码，并删除了多余的分号和空格
        run: python main.py -u 18613802948 -p qwertyuiop123 -l 266967735
