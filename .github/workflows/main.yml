name: 刷课

on:
  # push:
  #   branches: [ main ]
  schedule:
    - cron: "00 22 * * *"

jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖包
        run: |
          pip install -r ./requirements.txt

      - name: Run main.py
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
        run: |
          python main.py -u 13621339025 -p jingchuan0211 -l 266967732 -j 1 &
          python main.py -u 15652009150 -p jpf0105@ -l 266967735 -j 1 &
          wait
